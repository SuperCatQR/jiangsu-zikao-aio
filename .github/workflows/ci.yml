name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run content gates
        run: python scripts/run-gates.py
      - name: Run tests
        run: pytest -q
      - name: Run Ruff lint
        run: ruff check scripts tests
      - name: Check source links
        run: python scripts/check-source-links.py --offline
      - name: Build MkDocs site
        run: mkdocs build --strict
