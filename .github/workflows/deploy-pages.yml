name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages-probe.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run content gates
        run: python scripts/run-gates.py
      - name: Run tests
        run: pytest -q
      - name: Run Ruff lint
        run: ruff check scripts tests
      - name: Check source links
        run: python scripts/check-source-links.py --offline
      - name: Build MkDocs site
        run: mkdocs build --strict
      - name: Probe GitHub Pages enablement
        id: pages-probe
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Pages site is enabled; deployment steps will run."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled for this repository (API $status). Skipping deployment steps; content checks still passed."
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages-probe.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages-probe.outputs.enabled == 'true'
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.pages_enabled == 'true'
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
